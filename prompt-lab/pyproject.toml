[project]
name = "promptlab"
version = "0.1.0"
description = "Measure how prompt quality and model generation affect results and token cost."
requires-python = ">=3.11"  # httpx2 and jiter (Anthropic SDK dependencies) need 3.11
# Pinned; install from the internal mirror on the secure network.
dependencies = [
  "anthropic==2.11.0",
  "httpx==0.27.2",
  "pydantic==2.9.2",
  "PyYAML==6.0.2",
  "SQLAlchemy==2.0.36",
]

[project.optional-dependencies]
dev = ["pytest==8.3.3"]

[project.scripts]
prompt-lab = "promptlab.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["promptlab*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
