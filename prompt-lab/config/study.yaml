repeats: 5
# Harness sessions (spec sections 5.2 and 6.2); models default to the list above.
harness:
  variants: [h-terse, h-discoverable-gap, h-private-gap, h-full]
  repeats: 3
  max_requests: 25
  max_input_tokens: 60000
judge:
  primary: opus-5
  cross_check: gpt-5.6-luna
  cross_check_share: 0.2
