# Check the harness site on every PR, and publish it to GitHub Pages from main.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The site is static with relative paths, so it works from the
# /<repo>/ subpath that Pages serves it under.
name: Site checks and Pages deploy

on:
  push:
    branches: [main]
    paths: ["harness-site/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["harness-site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy mid-flight; let the newest one queue behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run site checks
        run: python3 harness-site/tools/check.py

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Publish the site folder only, not the spec or workflow files.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: harness-site
      - id: deployment
        uses: actions/deploy-pages@v4
