# Check the harness site on every PR, and publish it to GitHub Pages from main.
#
# One-time setup: Settings > Pages > Build and deployment > Source: "GitHub Actions".
# The site is static with relative paths, so it works from the
# /<repo>/ subpath that Pages serves it under.
name: Site checks and Pages deploy

on:
  push:
    branches: [main]
    paths: ["harness-site/**", "course/**", ".github/workflows/pages.yml"]
  pull_request:
    paths: ["harness-site/**", "course/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

# Never cancel a deploy mid-flight; let the newest one queue behind it.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run site checks
        run: python3 harness-site/tools/check.py

  deploy:
    needs: check
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Site and course side by side, as content links expect (../course/).
      # The root page forwards to the site.
      - name: Stage site and course
        run: |
          mkdir -p _site
          cp -r harness-site course _site/
          rm -rf _site/harness-site/tools
          # Instructor-only material stays in the repo, not on the student site.
          find _site/course -iname '*INSTRUCTOR*' -delete
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>Inside the Harness</title>' \
            '<meta http-equiv="refresh" content="0; url=harness-site/index.html">' \
            '<a href="harness-site/index.html">Inside the Harness</a>' > _site/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
